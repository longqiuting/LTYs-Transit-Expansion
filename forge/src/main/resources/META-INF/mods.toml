modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/longqiuting/mtr-external-lights/issues"

[[mods]]
modId = "lte"
version = "${version}"
displayName = "LTY's Transit Expansion"
logoFile = "icon.png"
authors = "厦航在拍车的无名机长 (kigurumiLTY)"
description = '''
LTY's Transit Expansion（LTE）是 Minecraft Transit Railway 的体验优化拓展：动态车头灯与车尾灯、随车移动的可视光柱、屏幕空间散射与雨雾水花、列车碰撞与撞飞、道床判定、粒子裁剪，以及信号灯 / 投影机 / PIDS 连接器和游戏内 3D 光束编辑器。服务端也安装时，碰撞、撞飞与伤害由服务端结算；只装客户端同样可以正常使用。 LTY's Transit Expansion (LTE) improves Minecraft Transit Railway: dynamic head and tail lights with visible moving beams, screen-space scattering, rain mist and track spray, train collisions and knock-back, trackbed detection, particle culling, plus signal, projector and PIDS linkers with an in-game 3D beam editor. Install it on the server as well and collisions, knock-back and damage are resolved server-side; a client-only install still works.
'''

[[dependencies.lte]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.lte]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

# 运行期由已安装的 MTR Forge 版提供。
# versionRange 必须匹配 MTR 实际的版本字符串：YMTR forge 的 mods.toml 写的是
# version = "1.20.1-3.6.6.1"，Maven 序比较下 "3.6" 反而比它大（首段 3 > 1），
# 写成 "[3.6,)" 会被判为「已安装但不受支持」→ Forge 直接拒绝加载（即使 mandatory=false）。
[[dependencies.lte]]
modId = "mtr"
mandatory = false
versionRange = "[1.20.1-3.6,)"
ordering = "AFTER"
side = "BOTH"

# Forge 1.20.1 实际是读 jar 清单的 MixinConfigs 属性（build.gradle 的 jar.manifest 里已写），
# 这一节是 NeoForge 的写法，1.20.1 的 ModFileInfo 只按 key 取自己认识的字段。
[[mixins]]
config = "lte.forge.mixins.json"
